stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
      - data/raw
    params:
      - prepare
    outs:
      - data/prepared
  train:
    cmd: python -m src.train
    deps:
      - src/train.py
      - data/prepared
    params:
      - train
    metrics:
      - metrics.json:
          cache: false
