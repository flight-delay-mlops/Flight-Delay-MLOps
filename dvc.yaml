stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
      - data/raw
    params:
      - prepare
    outs:
      - data/prepared
  features:
    cmd: python -m src.features
    deps:
      - src/features.py
      - api/features.py
      - data/raw
    outs:
      - data/features
  train:
    cmd: python -m src.train
    deps:
      - src/train.py
      - src/models.py
      - src/features.py
      - api/features.py
      - data/prepared
      - data/features
    params:
      - train
