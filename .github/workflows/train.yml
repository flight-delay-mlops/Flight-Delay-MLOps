# Continuous training: run the DVC pipeline (prepare + train) and register the new model.
name: Train

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "dvc.yaml"
      - "dvc.lock"
      - "params.yaml"
      - "data/*.dvc"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/train.yml"
  workflow_dispatch:
    inputs:
      force:
        # DVC only retrains when the code, data or params change, not the Dockerfile or packages
        description: "Retrain even if nothing changed"
        type: boolean
        default: false

# One run at a time, and never cancel one halfway through a dvc push
concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    # Needs our own runner: the DVC remote (and later MLflow) is only reachable inside DEI
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure DVC
        env:
          DVC_SSH_KEY: ${{ secrets.DVC_SSH_KEY }}
        run: |
          # Private key that can log in to VM1 as admin, only on disk during this job
          if [ -z "$DVC_SSH_KEY" ]; then
            echo "::error::Secret DVC_SSH_KEY is empty or missing (it must be a repository secret)"
            exit 1
          fi
          key="$RUNNER_TEMP/dvc_ssh_key"
          # Drop Windows line endings, which break the key if it was copied from a Windows editor
          printf '%s\n' "$DVC_SSH_KEY" | tr -d '\r' > "$key"
          chmod 600 "$key"
          # Fails here, with a clear message, if the key is malformed or has a passphrase
          if ! ssh-keygen -y -P "" -f "$key" > /dev/null; then
            echo "::error::DVC_SSH_KEY is not a valid private key without a passphrase"
            exit 1
          fi
          dvc remote modify --local vm1 keyfile "$key"
          # Keep the DVC cache outside the checkout, which is wiped on every run,
          # so later runs only download what changed
          dvc cache dir --local "$HOME/.cache/dvc/${{ github.event.repository.name }}"

      - name: Pull data
        # Outputs missing from the remote (e.g. someone forgot `dvc push`) are not an
        # error: dvc repro rebuilds them below and dvc push uploads them
        run: dvc pull --allow-missing

      - name: Build training image
        run: docker build -t flight-delay-train .

      - name: Run pipeline
        # dvc repro (prepare + train) runs inside the training image. The repo and the
        # DVC cache are mounted at the same paths, so DVC finds its config, cache and
        # dvc.lock as if it ran here. --user keeps the files it writes owned by the runner
        env:
          MLFLOW_TRACKING_URI: http://10.17.0.167:5000
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then cmd="dvc repro --force --single-item train"; else cmd="dvc repro"; fi
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e USER=runner \
            -e MLFLOW_TRACKING_URI -e MLFLOW_TRACKING_USERNAME -e MLFLOW_TRACKING_PASSWORD \
            -v "$PWD:$PWD" -v "$HOME/.cache/dvc:$HOME/.cache/dvc" -w "$PWD" \
            flight-delay-train $cmd

      - name: Push outputs
        run: dvc push

      - name: Report dvc.lock changes
        run: |
          {
            echo "## dvc.lock"
            if git diff --quiet dvc.lock; then
              echo "No changes: every stage was already up to date."
            else
              echo "Stages re-ran. New dvc.lock (outputs pushed to the DVC remote):"
              echo '```diff'
              git diff dvc.lock
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save dvc.lock
        uses: actions/upload-artifact@v4
        with:
          name: dvc-lock
          path: dvc.lock

      - name: Remove SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/dvc_ssh_key"
